[package]
name = "rasterqc"
version = "0.1.0"
edition = "2021"
description = "High-performance raster statistics using a Rust backend"
license = "MIT OR Apache-2.0"
authors = ["Rebecca Ryan <ryan_rebecca@hotmail.com>"]
repository = "https://github.com/becryan/rasterqc"
readme = "README-rust.md"
keywords = ["raster", "statistics", "image", "qc", "geospatial"]
categories = ["science", "image-processing", "mathematics"]

# Exclude non-Rust packaging files
exclude = [
    "python/*",
    "pyproject.toml",
    "pixi.toml",
    "pixi.lock",
    ".pixi/*",
    "target/*",
    "*.ipynb",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.19", features = ["extension-module"] }
numpy = "0.19"
rayon = "1.10"
num-traits = "0.2"
ordered-float = "3.1"
thiserror = "1.0"

# CLI (downgraded to avoid edition 2024)
clap = { version = "=4.5.4", features = ["derive"] }
clap_derive = "=4.5.4"

serde_json = "1.0"

[[bin]]
name = "rasterqc"
path = "src/bin/rasterqc.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
