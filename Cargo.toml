[package]
name = "rasterqc"
version = "0.1.0"
edition = "2021"
description = "High-performance raster statistics using a Rust backend"
license = "MIT"
readme = "README.md"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/yourusername/rasterqc"
keywords = ["raster", "statistics", "image", "qc", "earthobservation"]
categories = ["science", "image-processing", "mathematics"]

[lib]
crate-type = ["rlib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.19", features = ["extension-module"] }

# NumPy <-> Rust zero-copy interop
numpy = "0.19"

# Optional: parallel raster processing -multicore processing
rayon = "1.10"

# Optional: fast math helpers (SIMD-friendly)
num-traits = "0.2"

# Ordered wrappers for stable Ord on floats used by selection algorithms
ordered-float = "3.1"

# Optional: error handling ergonomics
thiserror = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# JSON serialization
serde_json = "1.0"

[[bin]]
name = "rasterqc"
path = "src/bin/rasterqc.rs"

[profile.release]
# Optimize for maximum runtime performance
opt-level = 3
codegen-units = 1
lto = true
